<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>API - Consulta Clima</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="estilo2.css" />

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <a class="navbar-brand" href="index.html">PARTES DE UM COMPUTADOR</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door-fill"></i> Início</a></li>
      </ul>
    </div>
  </nav>

  <div class="custom-box">
    <h1>Consulta Clima</h1>
    <label for="city">Digite a cidade:</label><br/>
    <input type="text" id="city" placeholder="Ex: São Paulo"><br/>
    <button id="btnSearch">Buscar</button>
    <div id="result"></div>
  </div>

  <div class="footer">2025 Guia de Hardware</div>

  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>

  <script>
    $(document).ready(function () {
      $('#btnSearch').click(function () {
        const city = $('#city').val().trim();
        const apiKey = 'fa383a792f50989197752911dba007ff';

        if (!city) {
          alert('Por favor, digite o nome da cidade!');
          return;
        }

        const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=pt_br`;

        $.ajax({
          url: url,
          type: 'GET',
          success: function (data) {
            const temp = data.main.temp;
            const desc = data.weather[0].description;
            const cityName = data.name;
            const country = data.sys.country;

            $('#result').html(`
              <div class="card">
                <div class="card-body">
                  <h2 class="card-title">Clima em ${cityName}, ${country}</h2>
                  <p class="card-text">Temperatura: <strong>${temp} °C</strong></p>
                  <p class="card-text">Condição: <strong>${desc}</strong></p>
                </div>
              </div>
            `);
          },
          error: function () {
            $('#result').html('<p class="text-danger">Não foi possível obter os dados do clima. Verifique o nome da cidade ou tente novamente.</p>');
          }
        });
      });
    });
  </script>
</body>
</html>
